[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hearlike"
version = "0.1.0"
description = "Find songs that sound like a song you like, by actually listening to the audio."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "librosa",
    "soundfile",
    "numpy",
    "requests",
]

[project.optional-dependencies]
ui = ["streamlit"]

[project.scripts]
hearlike = "hearlike.cli:main"

[tool.setuptools.packages.find]
include = ["hearlike"]
